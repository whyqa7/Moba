name: Build & Release APK

on:
  push:
    tags: ['v*']          # contoh: git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:       # atau jalankan manual dari tab Actions

permissions:
  contents: write          # dibutuhkan untuk membuat GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Paksa mode landscape
        run: |
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="sensorLandscape"|' android/app/src/main/AndroidManifest.xml
          grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK (debug-signed, langsung bisa diinstall)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Tentukan nama versi
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "LegendasNusantara-${{ steps.ver.outputs.tag }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegendasNusantara-apk
          path: LegendasNusantara-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Legendas Nusantara ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: LegendasNusantara-*.apk
